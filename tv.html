<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão à Vista T32 — Portocel</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<style>
  :root{
    --blue:#004A99; --teal:#038799; --green:#8ABA3D; --orange:#E8841A; --danger:#D9534F;
    --dark:#2A3F54; --bg:#EEF2F6; --card:#FFFFFF; --border:#DDE4EC; --muted:#7A8FA6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Montserrat',sans-serif;background:var(--bg);color:var(--dark);
       display:flex;flex-direction:column;overflow:hidden}

  /* ── cabeçalho ── */
  header{background:linear-gradient(90deg,var(--blue),var(--teal));color:#fff;
         padding:9px 22px;display:flex;justify-content:space-between;align-items:center;
         gap:16px;flex-wrap:wrap;flex:none}
  .marca{display:flex;align-items:center;gap:14px}
  .marca img{height:30px;filter:brightness(0) invert(1)}
  .marca .tit{font-size:15px;font-weight:800;letter-spacing:.05em;line-height:1.2}
  .marca .sub{font-size:10px;font-weight:600;color:rgba(255,255,255,.68)}
  .aovivo{display:flex;align-items:center;gap:6px;background:rgba(217,83,79,.95);padding:4px 10px;
          border-radius:5px;font-size:10px;font-weight:800;letter-spacing:.09em}
  .aovivo .p{width:6px;height:6px;border-radius:50%;background:#fff;animation:pulso 1.8s ease-in-out infinite}
  @keyframes pulso{0%,100%{opacity:1}50%{opacity:.15}}
  @media(prefers-reduced-motion:reduce){.aovivo .p{animation:none}}
  .hdr-d{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .relogio{font-size:23px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .turno{text-align:right;line-height:1.15}
  .turno .c{font-size:9px;font-weight:700;letter-spacing:.09em;color:rgba(255,255,255,.6)}
  .turno .v{font-size:16px;font-weight:800}
  .conx{font-size:10px;font-weight:600;color:rgba(255,255,255,.6);text-align:right;line-height:1.35;
        font-variant-numeric:tabular-nums}
  .conx b{color:#CDEB9A} .conx.off b{color:#FFC9C7} .conx.off{color:#FFC9C7}

  /* ── mosaico 2×1 ── */
  .mosaico{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 10px 0;min-height:0}
  .col{display:flex;flex-direction:column;gap:10px;min-height:0}
  .col-rot{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
           color:var(--muted);padding:0 2px;flex:none}
  .bloco{background:var(--card);border:1px solid var(--border);border-radius:12px;
         padding:13px 15px;display:flex;flex-direction:column;min-height:0}
  .bloco.g1{flex:1;min-height:0}
  .bloco.g14{flex:1.4;min-height:0}
  .bloco h2{font-size:10px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;
            color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:8px;flex:none}
  .bloco h2::before{content:'';width:3px;height:12px;border-radius:2px;background:var(--teal)}
  .bloco h2 .dir{margin-left:auto;font-size:9px;letter-spacing:.04em;color:var(--muted);text-transform:none;font-weight:700}
  .b-desc h2::before{background:var(--orange)} .b-oper h2::before{background:var(--green)}
  .b-emb h2::before{background:var(--blue)}
  .cresce{flex:1;min-height:0;overflow:auto}
  .cresce::-webkit-scrollbar{width:5px}
  .cresce::-webkit-scrollbar-thumb{background:#C9D6E3;border-radius:3px}

  /* números */
  .nums{display:flex;gap:12px;flex:none}
  .nn{flex:1;min-width:74px}
  .nn .v{font-size:clamp(20px,2.5vh,32px);font-weight:800;line-height:1.05;letter-spacing:-.02em;
         font-variant-numeric:tabular-nums}
  .nn .l{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;
         letter-spacing:.06em;margin-top:3px}
  .nn.t .v{color:var(--teal)} .nn.g .v{color:#6E9A22} .nn.o .v{color:var(--orange)}
  .nn.r .v{color:var(--danger)} .nn.b .v{color:var(--blue)}

  /* barras de programação */
  .prog{margin-top:11px;flex:none}
  .prog .tp{display:flex;justify-content:space-between;gap:8px;font-size:11px;font-weight:700;margin-bottom:4px}
  .prog .tp span{color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
  .barra{background:#E4EBF2;border-radius:5px;height:14px;overflow:hidden}
  .barra i{display:block;height:100%;border-radius:5px;background:var(--teal);transition:width .6s}
  .barra i.ok{background:var(--green)}

  /* ramal */
  .ramal{margin-top:9px;flex:none}
  .via{display:flex;align-items:center;gap:3px;margin-bottom:3px}
  .via .vn{font-size:8.5px;font-weight:800;color:var(--muted);width:20px;flex:none}
  .vg{flex:1;height:10px;border-radius:2px;background:#E4EBF2}
  .vg.ok{background:var(--blue)}

  /* histograma de estoque */
  .hist{display:flex;align-items:flex-end;gap:4px;height:52px;margin-top:11px;flex:none}
  .hc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
  .hc i{width:100%;max-width:24px;background:var(--teal);border-radius:3px 3px 0 0;min-height:3px}
  .hc span{font-size:7.5px;font-weight:700;color:var(--muted);margin-top:3px}

  /* ocupação por vão */
  .vaos{display:flex;gap:2px;align-items:flex-end;height:44px;margin-top:9px}
  .vv{flex:1;background:#E4EBF2;border-radius:3px 3px 0 0;position:relative;min-width:5px;height:100%}
  .vv i{position:absolute;bottom:0;left:0;width:100%;background:var(--teal);border-radius:3px 3px 0 0}
  .vv i.cheio{background:var(--orange)}
  .vzr{display:flex;gap:2px;margin-top:2px}
  .vzr span{flex:1;font-size:6.5px;color:var(--muted);text-align:center;font-weight:700;min-width:5px}

  /* frentes */
  .frente{background:#F6F9FC;border:1px solid var(--border);border-left:3px solid var(--teal);
          border-radius:8px;padding:8px 11px;margin-bottom:7px}
  .frente.viva{border-left-color:var(--green);background:#F4FAEC}
  .frente .t{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;
             font-size:12px;font-weight:800}
  .frente .t em{font-style:normal;font-size:9.5px;font-weight:800;color:#5E8A16}
  .frente .t .hh{font-size:9.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
  .frente .d{font-size:10.5px;font-weight:600;color:var(--muted);margin-top:4px;line-height:1.5}
  .frente .d b{color:var(--dark)}
  .pill{display:inline-block;font-size:9px;font-weight:800;padding:2px 7px;border-radius:5px;
        background:rgba(3,135,153,.12);color:var(--teal);margin:0 4px 3px 0}
  .pill.o{background:rgba(232,132,26,.14);color:#B8630A}
  .pill.r{background:rgba(217,83,79,.12);color:var(--danger)}

  /* rodapé do período */
  .rodape{background:var(--dark);color:#fff;border-radius:12px;margin:10px;padding:11px 18px;flex:none;
          display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .rodape .lado{min-width:150px}
  .rodape .lado.dir{text-align:right}
  .rodape .lado .cap{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
                     color:rgba(255,255,255,.45)}
  .rodape .lado .val{font-size:clamp(18px,2.4vh,28px);font-weight:800;line-height:1.1;
                     font-variant-numeric:tabular-nums}
  .rodape .lado .un{font-size:10px;font-weight:700;color:rgba(255,255,255,.62)}
  .rodape .meio{flex:1;display:flex;justify-content:center;gap:20px;flex-wrap:wrap}
  .rodape .meio div{font-size:10px;font-weight:700;color:rgba(255,255,255,.62);
                    white-space:nowrap;text-align:center}
  .rodape .meio b{display:block;font-size:15px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums}

  /* embarque — navio + rosquinha */
  .navio{display:flex;align-items:center;gap:16px;flex:none}
  .rosca{position:relative;width:clamp(108px,15vh,150px);height:clamp(108px,15vh,150px);flex:none}
  .rosca svg{transform:rotate(-90deg)}
  .rosca .cen{position:absolute;inset:0;display:flex;flex-direction:column;
              align-items:center;justify-content:center;line-height:1}
  .rosca .cen b{font-size:clamp(22px,3.1vh,34px);font-weight:800;color:var(--blue);
                font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .rosca .cen span{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;
                   letter-spacing:.07em;margin-top:3px}
  .navio .info{flex:1;min-width:0}
  .navio .nm{font-size:clamp(15px,2.1vh,22px);font-weight:800;letter-spacing:-.01em;line-height:1.15}
  .navio .rota{font-size:10.5px;font-weight:600;color:var(--muted);margin:3px 0 10px}
  .alerta{background:rgba(217,83,79,.1);color:var(--danger);border-radius:6px;padding:4px 8px;
          font-size:9.5px;font-weight:800;margin-bottom:8px;display:inline-block}

  /* porões */
  .poroes{display:flex;align-items:flex-end;gap:8px;height:clamp(74px,12vh,120px);flex:none;margin-top:2px}
  .po{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
  .po .pc{font-size:9.5px;font-weight:800;margin-bottom:3px;font-variant-numeric:tabular-nums}
  .po .cx{width:100%;max-width:42px;background:#E4EBF2;border-radius:4px 4px 0 0;
          display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
  .po .cx i{display:block;width:100%;background:var(--blue);transition:height .6s}
  .po .cx i.ok{background:var(--green)}
  .po .nm{font-size:9px;font-weight:800;color:var(--muted);margin-top:4px}

  /* grade hora a hora */
  table.grade{width:100%;border-collapse:collapse;font-size:11px}
  table.grade th{font-size:8.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
                 color:var(--muted);text-align:left;padding:0 6px 5px;border-bottom:1px solid var(--border)}
  table.grade td{padding:5px 6px;border-bottom:1px solid #EEF2F6;font-weight:700;
                 font-variant-numeric:tabular-nums}
  table.grade td.num{text-align:right}
  table.grade td.par{font-size:9.5px;font-weight:800;color:var(--danger);white-space:nowrap}
  table.grade tr.ult td{background:#F4FAEC}
  table.grade td .pr{font-size:9px;font-weight:700;color:var(--muted)}

  .vazio{font-size:11.5px;font-weight:600;color:var(--muted);text-align:center;padding:18px 8px;line-height:1.6}

  @media(max-width:900px){
    body{overflow:auto}
    .mosaico{grid-template-columns:1fr;height:auto}
    .col{min-height:0}
    .bloco{min-height:190px}
    .relogio{font-size:18px}
    .rodape .ri{margin-left:0}
  }
</style>
</head>
<body>

<header>
  <div class="marca">
    <img id="logo" src="" alt="Portocel">
    <div>
      <div class="tit">GESTÃO À VISTA T32</div>
      <div class="sub">Portocel · Santos · Berço 32</div>
    </div>
    <span class="aovivo"><span class="p"></span>AO VIVO</span>
  </div>
  <div class="hdr-d">
    <div class="relogio" id="relogio">--:--:--</div>
    <div class="turno"><div class="c">TURNO · PERÍODO</div><div class="v" id="turno">—</div></div>
    <div class="conx" id="conx"><b>●</b> conectando<br><span></span></div>
  </div>
</header>

<div class="mosaico">

  <!-- ════ COLUNA ESQUERDA — RETAGUARDA ════ -->
  <div class="col">
    <div class="col-rot">Retaguarda</div>

    <div class="bloco b-est">
      <h2>Estoque do armazém<span class="dir" id="est-dir"></span></h2>
      <div id="est-corpo"></div>
    </div>

    <div class="bloco b-desc">
      <h2>Descarga<span class="dir" id="desc-dir"></span></h2>
      <div id="desc-corpo"></div>
    </div>

    <div class="bloco b-oper g1">
      <h2>Operação T32 · frentes de trabalho</h2>
      <div class="cresce" id="oper-corpo"></div>
    </div>

  </div>

  <!-- ════ COLUNA DIREITA — EMBARQUE ════ -->
  <div class="col">
    <div class="col-rot">Embarque</div>

    <div class="bloco b-emb">
      <h2>Navio em operação</h2>
      <div id="emb-topo"></div>
    </div>

    <div class="bloco b-emb g14">
      <h2>Hora a hora por terno<span class="dir" id="emb-grade-dir"></span></h2>
      <div class="cresce" id="emb-grade"></div>
    </div>

    <div class="bloco b-emb g1">
      <h2>Frentes no embarque</h2>
      <div class="cresce" id="emb-frentes"></div>
    </div>
  </div>

</div>

<div class="rodape" id="rodape"></div>

const PER=['07\u00d713','13\u00d719','19\u00d701','01\u00d707'];

const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const hoje=()=>iso(new Date());
const ontem=()=>{const d=new Date();d.setDate(d.getDate()-1);return iso(d);};

// as duas metades do turno de 12h que já aconteceram
// 07x13 e 13x19 no mesmo dia; 19x01 de um dia emenda com 01x07 do seguinte
function janelaTurno(){
  const p=curPer(), h=hoje(), o=ontem();
  if(p===0)return [[h,0]];
  if(p===1)return [[h,0],[h,1]];
  if(p===2)return [[h,2]];
  return [[o,2],[h,3]];
}

function escutar(){
  const d=hoje();
  db.collection('registros').where('data','in',[ontem(),d])
    .onSnapshot(s=>{dados.regs=s.docs.map(x=>({id:x.id,...x.data()}));ok();},err);

  db.collection('navios').where('ativo','==',true)
    .onSnapshot(s=>{
      const lista=s.docs.map(x=>({id:x.id,...x.data()}))
        .sort((a,b)=>String(b.criadoEm||'').localeCompare(String(a.criadoEm||'')));
      dados.naviosAtivos=lista;
      const novo=lista[0]||null;
      if((novo&&novo.id)!==(dados.navio&&dados.navio.id)){
        dados.navio=novo; dados.horas=[];
        if(unsubHoras){unsubHoras();unsubHoras=null;}
        if(novo)unsubHoras=db.collection('embarque_horas').where('navioId','==',novo.id)
          .onSnapshot(h=>{dados.horas=h.docs.map(x=>x.data());ok();},err);
      }
      ok();
    },err);

  db.collection('programacoes').where('aberta','==',true)
    .onSnapshot(s=>{dados.progs=s.docs.map(x=>x.data());ok();},err);
  db.collection('estoque_horas').where('data','==',d)
    .onSnapshot(s=>{dados.estoque=s.docs.map(x=>x.data())
      .sort((a,b)=>String(a.hora).localeCompare(String(b.hora)));ok();},err);
  db.collection('contagens_armazem').orderBy('data','desc').limit(1)
    .onSnapshot(s=>{dados.contagem=s.empty?null:s.docs[0].data();ok();},err);
}

// ══════════ ESTOQUE DO ARMAZÉM ══════════
const VAOS_ORDEM=['V08','V21','V20','V19','V18','V17','V16','V15','V14','V13','V12','V11','V10','V09',
                  'V07','V06','V05','V04','V03','V02','V01'];
const CAP_V={V01:1618,V02:1334,V03:638,V04:578,V05:878,V06:522,V07:522,V08:462,
  V09:792,V10:1596,V11:798,V12:1596,V13:1664,V14:1596,V15:798,V16:1596,
  V17:1664,V18:798,V19:1664,V20:1596,V21:710};

// tolera V1 / V\u00e3o 01 / v 01 vindos de contagens antigas
function normPonto(s){
  let p=String(s||'').trim().toUpperCase().replace(/\s+/g,' ');
  p=p.replace(/^V[\u00c3A]O\s*/,'V').replace(/^V\s+/,'V');
  const m=p.match(/^V(\d{1,2})$/);
  return m?'V'+m[1].padStart(2,'0'):p;
}

function estoque(){
  const box=document.getElementById('est-corpo');
  const e=dados.estoque, ult=e[e.length-1], c=dados.contagem;
  document.getElementById('est-dir').textContent=ult?'\u00faltimo lan\u00e7amento '+ult.hora:'';

  if(!ult&&!c){box.innerHTML='<div class="vazio">Nenhum estoque lan\u00e7ado hoje.</div>';return;}

  const geral=ult?(ult.atadosGeral||0):0, avaria=ult?(ult.atadosAvaria||0):0;
  let h=`<div class="nums">
    <div class="nn"><div class="v">${fmt(geral)}</div><div class="l">Atados geral</div></div>
    <div class="nn t"><div class="v">${fmt(geral*TON_ATADO)}</div><div class="l">Toneladas</div></div>
    <div class="nn r"><div class="v">${fmt(avaria)}</div><div class="l">Atados avaria</div></div>
    <div class="nn o"><div class="v">${fmt(avaria*TON_ATADO)}</div><div class="l">t avaria</div></div>
  </div>`;

  if(e.length){
    const max=Math.max(...e.map(x=>x.total||0),1);
    h+=`<div class="hist">${e.map(x=>`<div class="hc" title="${x.hora}: ${fmt(x.total)} atados">
      <i style="height:${Math.max(4,(x.total||0)/max*100)}%"></i>
      <span>${String(x.hora).slice(0,2)}</span></div>`).join('')}</div>`;
  }

  if(c){
    const porPonto={};
    (c.pontos||[]).forEach(p=>{const k=normPonto(p.ponto);porPonto[k]=(porPonto[k]||0)+(p.qtd||0);});
    if(porPonto.BUFFER>0){
      const bf=porPonto.BUFFER, vgEq=bf/ATADOS_VAGAO;
      h+=`<div style="display:flex;align-items:baseline;gap:8px;margin-top:12px;padding-top:10px;
           border-top:1px solid var(--border);">
        <span style="font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);">Buffer</span>
        <b style="font-size:16px;font-weight:800;color:var(--orange);font-variant-numeric:tabular-nums;">${fmt(bf)}</b>
        <span style="font-size:10.5px;font-weight:700;color:var(--muted);">atados \u00b7 ${vgEq.toFixed(1)} vag\u00f5es \u00b7 contagem de ${String(c.data).slice(8,10)}/${String(c.data).slice(5,7)}</span>
      </div>`;
    }
    const casam=VAOS_ORDEM.filter(v=>porPonto[v]>0).length;
    h+=`<div style="font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:12px;">
      Ocupa\u00e7\u00e3o por v\u00e3o \u00b7 contagem de ${String(c.data).slice(8,10)}/${String(c.data).slice(5,7)}</div>`;
    if(!casam){
      h+='<div class="vazio" style="padding:10px 6px;">A \u00faltima contagem n\u00e3o traz v\u00e3os reconhecidos.</div>';
    }else{
      h+=`<div class="vaos">${VAOS_ORDEM.map(v=>{
        const q=porPonto[v]||0, cap=CAP_V[v]||1, pc=Math.min(100,q/cap*100);
        return `<div class="vv" title="${v}: ${fmt(q)} de ${fmt(cap)} atados">
          <i class="${pc>=85?'cheio':''}" style="height:${pc}%"></i></div>`;}).join('')}</div>
        <div class="vzr">${VAOS_ORDEM.map(v=>`<span>${v.slice(1)}</span>`).join('')}</div>`;
    }
    if(c.divergencia!=null&&Math.abs(c.divergencia)>0){
      h+=`<div style="font-size:10px;font-weight:700;margin-top:8px;color:${Math.abs(c.divergencia)>200?'var(--danger)':'var(--muted)'};">
        Diverg\u00eancia da contagem: ${fmt(Math.abs(c.divergencia))} atados</div>`;
    }
  }
  box.innerHTML=h;
}

// ══════════ DESCARGA ══════════
function descarga(){
  const box=document.getElementById('desc-corpo');
  const regs=regsDeHoje().filter(r=>r.atividade==='recebimento');
  const ferro=regs.filter(r=>r.producao&&r.producao.tipo==='Ferro');
  const rodo =regs.filter(r=>r.producao&&r.producao.tipo==='Rodo');
  const vg=ferro.reduce((s,r)=>s+(r.producao.qtd||0),0);
  const at=rodo.reduce((s,r)=>s+(r.producao.qtd||0),0);
  const car=rodo.reduce((s,r)=>s+(r.producao.carretas||0),0);

  let h=`<div class="nums">
    <div class="nn b"><div class="v">${fmt(vg)}</div><div class="l">Vag\u00f5es descarregados</div></div>
    <div class="nn t"><div class="v">${fmt(vg*TON_VAGAO)}</div><div class="l">t ferrovi\u00e1rio</div></div>
    <div class="nn o"><div class="v">${fmt(car)}</div><div class="l">Carretas</div></div>
    <div class="nn g"><div class="v">${fmt(at*TON_ATADO)}</div><div class="l">t rodovi\u00e1rio</div></div>
  </div>`;

  const pf=dados.progs.filter(p=>p.tipo==='ferro'), pr=dados.progs.filter(p=>p.tipo==='rodo');
  const pa=dados.progs.filter(p=>p.tipo==='avaria');
  const nProg=pf.length+pr.length+pa.length;
  document.getElementById('desc-dir').textContent=
    nProg?`${nProg} programa\u00e7\u00e3o(\u00f5es) aberta(s)`:'';
  const carAvaria=regsDeHoje().filter(r=>r.atividade==='avarias')
    .reduce((s,r)=>s+((r.producao&&r.producao.carretas)||0),0);

  pf.forEach(p=>{
    const pc=p.vagoesProg?Math.min(100,vg/p.vagoesProg*100):0;
    h+=`<div class="prog"><div class="tp"><b>Ferro \u00b7 ${p.prefixo||''}</b>
      <span>${fmt(vg)} de ${fmt(p.vagoesProg)} vag\u00f5es \u00b7 ${pc.toFixed(0)}%</span></div>
      <div class="barra"><i class="${pc>=100?'ok':''}" style="width:${pc}%"></i></div></div>`;
  });
  pr.forEach(p=>{
    const pc=p.carretasProg?Math.min(100,car/p.carretasProg*100):0;
    h+=`<div class="prog"><div class="tp"><b>Rodo \u00b7 ${p.sku||''}</b>
      <span>${fmt(car)} de ${fmt(p.carretasProg)} carretas \u00b7 ${pc.toFixed(0)}%</span></div>
      <div class="barra"><i class="${pc>=100?'ok':''}" style="width:${pc}%"></i></div></div>`;
  });

  pa.forEach(p=>{
    const alvo=p.carretasProg||0;
    const pc=alvo?Math.min(100,carAvaria/alvo*100):0;
    h+=`<div class="prog"><div class="tp"><b>Avaria \u00b7 ${p.sku||''}</b>
      <span>${fmt(carAvaria)} de ${fmt(alvo)} carretas \u00b7 ${pc.toFixed(0)}%</span></div>
      <div class="barra"><i class="${pc>=100?'ok':''}" style="width:${pc}%;background:var(--danger)"></i></div></div>`;
  });

  // ramal: o que ainda falta descarregar, enchendo L1 antes da L2
  if(pf.length){
    const prog=pf.reduce((s,p)=>s+(p.vagoesProg||0),0);
    const falta=Math.max(0,prog-vg);
    h+=`<div style="font-size:9.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
         color:var(--muted);margin-top:11px;">Ramal \u00b7 ${fmt(falta)} vag\u00f5es a descarregar</div>`;
    let resta=Math.min(RAMAL_LINHAS*RAMAL_POR_LINHA,falta);
    const porLinha=[];
    for(let i=0;i<RAMAL_LINHAS;i++){const n=Math.min(RAMAL_POR_LINHA,Math.max(0,resta));porLinha.push(n);resta-=n;}
    h+=`<div class="ramal">${[3,2,1,0].map(i=>
      `<div class="via"><span class="vn">L${i+1}</span>${[...Array(RAMAL_POR_LINHA)].map((_,j)=>
        `<div class="vg ${j<porLinha[i]?'ok':''}"></div>`).join('')}</div>`).join('')}</div>`;
  }

  if(!nProg&&!vg&&!at)
    h+='<div class="vazio">Sem descarga programada ou lan\u00e7ada hoje.</div>';
  box.innerHTML=h;
}

function regsDoTurno(){ return dados.regs.filter(r=>naJanela(r.data,r.periodoIdx)); }
function cardFrente(r){
  const e=r.efetivo||{};
  const pessoas=[r.colaborador,...((e.colegas||[]).map(c=>c.nome+(c.fte?' (FTE)':'')))].filter(Boolean);
  const ms=[...((r.recursos&&r.recursos.empilhadeiras)||[]),...((r.recursos&&r.recursos.porticos)||[])]
           .map(m=>m.maq+(m.op?' \u00b7 '+m.op:'')).filter(Boolean);
  const p=r.producao; let prod='';
  if(p){
    if(p.unidade==='ton'&&p.valor)prod=`<span class="pill">${fmt(p.valor)} t</span>`;
    else if(p.valor&&p.unidade==='vaos')prod=`<span class="pill">${p.valor} v\u00e3os</span>`;
    else if(p.valor&&p.unidade==='maquinas')prod=`<span class="pill">${p.valor} m\u00e1q.</span>`;
    else if(p.valor)prod=`<span class="pill">${fmt(p.valor)} t</span>`;
  }
  const viva=!!(r.frente&&r.frente.ativa);
  const def=r.recursos&&r.recursos.defeitos&&r.recursos.defeitos.ativo;
  const tpa=r.recursos&&r.recursos.tpa&&r.recursos.tpa.ativo;
  return `<div class="frente ${viva?'viva':''}">
    <div class="t"><span>${ATV[r.atividade]||r.atividade}</span>
      ${viva?'<em>\u25cf em andamento</em>':`<span class="hh">${(r.frente&&r.frente.inicio)||''}\u2013${(r.frente&&r.frente.fim)||''}</span>`}</div>
    <div class="d">${prod}
      ${e.ogmo?`<span class="pill o">${e.ogmo} OGMO</span>`:''}
      ${def?'<span class="pill r">defeito</span>':''}${tpa?'<span class="pill r">TPA</span>':''}
      ${r.detalhe?r.detalhe+'<br>':''}
      <b>${pessoas.join(', ')}</b>
      ${ms.length?'<br>'+ms.join(' \u00b7 '):''}</div>
  </div>`;
}
function operacao(){
  const box=document.getElementById('oper-corpo');
  const lista=frentesDoPeriodo().filter(r=>r.atividade!=='embarque');
  if(!lista.length){box.innerHTML=
    '<div class="vazio">Nenhuma frente de retaguarda neste per\u00edodo.</div>';return;}
  box.innerHTML=lista
    .sort((a,b)=>(((b.frente&&b.frente.ativa)?1:0)-((a.frente&&a.frente.ativa)?1:0))
      ||String((a.frente&&a.frente.inicio)||'').localeCompare(String((b.frente&&b.frente.inicio)||'')))
    .map(cardFrente).join('');
}

// ══════════ RODAPÉ — RESUMO DO PERÍODO ══════════
function tonDoRegistro(r){
  const p=r.producao; if(!p)return 0;
  if(p.unidade==='ton')return p.valor||0;
  if(p.tipo==='Ferro')return (p.qtd||0)*TON_VAGAO;
  if(p.tipo==='Rodo')return (p.qtd||0)*TON_ATADO;
  if(r.atividade==='avarias')return p.valor||0;
  return 0;
}
function rodape(){
  const lista=frentesDoPeriodo();
  const doTurno=regsDoTurno();
  const tRetag=doTurno.filter(r=>r.atividade!=='embarque').reduce((s,r)=>s+tonDoRegistro(r),0);
  const tEmb=dados.horas.filter(x=>naJanela(x.data,x.periodoIdx)).reduce((s,x)=>s+(x.somaTon||0),0);
  const vivas=lista.filter(r=>r.frente&&r.frente.ativa).length;
  const casa=lista.reduce((s,r)=>s+(((r.efetivo||{}).auxCasa)||0)+(((r.efetivo||{}).opCasa)||0),0);
  const ext=lista.reduce((s,r)=>s+(((r.efetivo||{}).ogmo)||0)+(((r.efetivo||{}).terc)||0),0);
  const maq=new Set();
  lista.forEach(r=>{
    (((r.recursos||{}).empilhadeiras)||[]).forEach(m=>m.maq&&maq.add(m.maq));
    (((r.recursos||{}).porticos)||[]).forEach(m=>m.maq&&maq.add(m.maq));
  });
  const oco=lista.filter(r=>(((r.recursos||{}).defeitos||{}).ativo)||(((r.recursos||{}).tpa||{}).ativo)).length;
  const ton=lista.reduce((s,r)=>s+tonDoRegistro(r),0);

  document.getElementById('rodape').innerHTML=`
    <div class="lado">
      <div class="cap">Retaguarda \u00b7 turno 12h</div>
      <div class="val">${fmt(tRetag)}</div>
      <div class="un">t lan\u00e7adas</div>
    </div>
    <div class="meio">
      <div><b>${turnoAgora()} \u00b7 ${PER[curPer()]}</b>per\u00edodo em curso</div>
      <div><b>${fmt(casa+ext)}</b>efetivo (${fmt(ext)} externo)</div>
      <div><b>${lista.length}</b>frentes (${vivas} em andamento)</div>
      <div><b>${maq.size}</b>m\u00e1quinas</div>
      <div><b>${oco}</b>ocorr\u00eancias</div>
    </div>
    <div class="lado dir">
      <div class="cap">Embarque \u00b7 turno 12h</div>
      <div class="val">${fmt(tEmb)}</div>
      <div class="un">t embarcadas</div>
    </div>`;
}

          <circle cx="75" cy="75" r="${R}" fill="none" stroke="${pcReal>=100?'#8ABA3D':'#004A99'}"
            stroke-width="17" stroke-linecap="round"
            stroke-dasharray="${(C*pc/100).toFixed(1)} ${C.toFixed(1)}"></circle>
        </svg>
        <div class="cen"><b>${fmt1(pcReal)}%</b><span>concluído</span></div>
      </div>
      <div class="info">
        ${dados.naviosAtivos.length>1?`<div class="alerta">${dados.naviosAtivos.length} navios marcados como ativos \u2014 mostrando o mais recente</div>`:''}
        <div class="nm">${n.nome||''}${n.viagem?' \u00b7 '+n.viagem:''}</div>

        <div class="nums">

      const feito=porPorao[p]||0, pcp=prev?Math.min(100,feito/prev*100):0, alt=prev/maxCap*100;

// ══════════ EMBARQUE — GRADE HORA A HORA ══════════
function listaParalisacoes(h){
  const arr=Array.isArray(h.paralisacoes)?h.paralisacoes.slice()
           :(h.paralisacao?[h.paralisacao]:[]);
  return arr.filter(p=>p&&p.sigla).map(p=>{
    const m=p.min!=null?p.min:(p.minutos!=null?p.minutos:p.duracao);
    return p.sigla+(m?' \u2013 '+String(m).padStart(2,'0')+'min':'');
  });
}

        const d=(x.ternos||[]).find(y=>y.terno===t);
        if(!d)return '<td>\u2014</td>';
        return `<td>${fmt(d.ton)} t<span class="pr"> \u00b7 P${d.porao||'\u2014'}</span></td>`;};
      const par=listaParalisacoes(x);
      return `<tr class="${i===linhas.length-1?'ult':''}"><td>${x.hora}</td>
        ${[...Array(nT)].map((_,k)=>cel(k+1)).join('')}
        <td class="num">${fmt(x.somaTon)}</td>
        <td class="par">${par.length?par.join(' || '):'<span class="pr">\u2014</span>'}</td></tr>`;
    }).join('')}</tbody></table>`;
}

// ══════════ EMBARQUE — FRENTES NOS TERNOS ══════════
function embFrentes(){
  const box=document.getElementById('emb-frentes');
  const lista=frentesDoPeriodo().filter(r=>r.atividade==='embarque');
  box.innerHTML=lista.length?lista.map(cardFrente).join('')
    :'<div class="vazio">Nenhuma frente de embarque neste per\u00edodo.</div>';
}
</script>
