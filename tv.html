<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operação T32 — Gestão à Vista</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<style>
  :root{
    --azul:#004A99; --teal:#038799; --verde:#8ABA3D; --orange:#E8841A; --danger:#D9534F;
    --bg:#0F1B2A; --card:#17273B; --linha:rgba(255,255,255,.08);
    --txt:#EAF0F6; --muted:#8FA6BF;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Montserrat',sans-serif;background:var(--bg);color:var(--txt);
       display:flex;flex-direction:column;overflow:hidden}

  header{background:linear-gradient(90deg,var(--azul),#0a3a72);padding:10px 20px;
         display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;flex:none}
  .marca{display:flex;align-items:center;gap:11px}
  .aovivo{display:flex;align-items:center;gap:6px;background:rgba(217,83,79,.92);padding:4px 10px;
          border-radius:5px;font-size:10px;font-weight:800;letter-spacing:.09em}
  .aovivo .p{width:6px;height:6px;border-radius:50%;background:#fff;animation:pulso 1.8s ease-in-out infinite}
  @keyframes pulso{0%,100%{opacity:1}50%{opacity:.2}}
  .marca .n{font-size:17px;font-weight:800;letter-spacing:.04em}
  .marca .s{font-size:11px;color:rgba(255,255,255,.6)}
  .hdr-d{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .relogio{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .turno{text-align:right;line-height:1.15}
  .turno .c{font-size:9px;color:rgba(255,255,255,.55);font-weight:700;letter-spacing:.09em}
  .turno .v{font-size:16px;font-weight:800}
  .conx{font-size:10px;color:rgba(255,255,255,.55);font-variant-numeric:tabular-nums;text-align:right;line-height:1.3}
  .conx b{color:var(--verde)}
  .conx.off b{color:var(--danger)}

  .grade{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;
         gap:10px;padding:10px;min-height:0}
  .q{background:var(--card);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;
     min-height:0;overflow:hidden;border:1px solid var(--linha)}
  .q h2{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
        margin-bottom:11px;display:flex;align-items:center;gap:8px;flex:none}
  .q h2::before{content:'';width:3px;height:13px;border-radius:2px;background:var(--teal)}
  .q.d h2::before{background:var(--orange)} .q.e h2::before{background:var(--azul)}
  .q.o h2::before{background:var(--verde)} .q.s h2::before{background:var(--teal)}
  .corpo{flex:1;overflow:auto;min-height:0}
  .corpo::-webkit-scrollbar{width:5px} .corpo::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:3px}

  .nums{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px;flex:none}
  .nn{flex:1;min-width:88px}
  .nn .v{font-size:26px;font-weight:800;line-height:1.05;letter-spacing:-.02em}
  .nn .l{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
  .nn.t .v{color:var(--teal)} .nn.g .v{color:var(--verde)} .nn.o .v{color:var(--orange)} .nn.r .v{color:var(--danger)}

  .prog{margin-bottom:11px}
  .prog .tp{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;margin-bottom:5px}
  .prog .tp span{color:var(--muted);font-weight:600}
  .barra{background:rgba(255,255,255,.09);border-radius:5px;height:16px;overflow:hidden}
  .barra i{display:block;height:100%;border-radius:5px;background:var(--teal);transition:width .6s}
  .barra i.ok{background:var(--verde)}

  .vias{margin-top:6px}
  .via{display:flex;align-items:center;gap:4px;margin-bottom:3px}
  .via .vn{font-size:8.5px;font-weight:800;color:var(--muted);width:22px;flex:none}
  .vg{flex:1;height:11px;border-radius:2px;background:rgba(255,255,255,.09)}
  .vg.ok{background:#2f6fd0}

  .poroes{display:flex;align-items:flex-end;gap:9px;height:120px;margin-top:4px}
  .po{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
  .po .pc{font-size:10px;font-weight:800;margin-bottom:4px}
  .po .cx{width:100%;max-width:44px;background:rgba(255,255,255,.09);border-radius:4px 4px 0 0;
          display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
  .po .cx i{display:block;width:100%;background:var(--teal);transition:height .6s}
  .po .cx i.ok{background:var(--verde)}
  .po .nm{font-size:9px;font-weight:700;color:var(--muted);margin-top:5px}

  .frente{background:rgba(255,255,255,.045);border-radius:9px;padding:10px 12px;margin-bottom:8px;
          border-left:3px solid var(--teal)}
  .frente .t{font-size:12.5px;font-weight:800;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .frente .t em{font-style:normal;font-size:10px;color:var(--verde);font-weight:800}
  .frente .d{font-size:10.5px;color:var(--muted);font-weight:600;margin-top:3px;line-height:1.45}
  .pill{display:inline-block;font-size:9px;font-weight:800;padding:2px 7px;border-radius:5px;
        background:rgba(3,135,153,.28);color:#7fd8e4;margin-right:4px}
  .pill.o{background:rgba(232,132,26,.25);color:#f0b06a}

  .vaos{display:flex;gap:2px;align-items:flex-end;height:74px;margin-top:8px}
  .vv{flex:1;background:rgba(255,255,255,.08);border-radius:3px 3px 0 0;position:relative;min-width:5px}
  .vv i{position:absolute;bottom:0;left:0;width:100%;background:var(--teal);border-radius:3px 3px 0 0}
  .vv i.cheio{background:var(--verde)}
  .vzr{display:flex;gap:2px;margin-top:3px}
  .vzr span{flex:1;font-size:6.5px;color:var(--muted);text-align:center;font-weight:700;min-width:5px}

  .vazio{font-size:12px;color:var(--muted);text-align:center;padding:24px 8px;line-height:1.6}

  @media(max-width:900px){
    body{overflow:auto}
    .grade{grid-template-columns:1fr;grid-template-rows:none;height:auto}
    .q{min-height:290px}
    .relogio{font-size:18px}
  }
</style>
</head>
<body>

<header>
  <div class="marca">
    <span class="aovivo"><span class="p"></span>AO VIVO</span>
    <div><div class="n">OPERAÇÃO T32</div><div class="s">Portocel · Santos · Berço 32</div></div>
  </div>
  <div class="hdr-d">
    <div class="relogio" id="relogio">--:--:--</div>
    <div class="turno"><div class="c">TURNO · PERÍODO</div><div class="v" id="turno">—</div></div>
    <div class="conx" id="conx"><b>●</b> conectando<br><span id="ult"></span></div>
  </div>
</header>

<div class="grade">
  <div class="q d"><h2>Descarga</h2><div class="corpo" id="q-descarga"></div></div>
  <div class="q e"><h2>Embarque</h2><div class="corpo" id="q-embarque"></div></div>
  <div class="q o"><h2>Operação T32 — frentes de trabalho</h2><div class="corpo" id="q-operacao"></div></div>
  <div class="q s"><h2>Estoque do armazém</h2><div class="corpo" id="q-estoque"></div></div>
</div>

function escutar(){
  const d=hoje();
  db.collection('registros').where('data','==',d)
    .onSnapshot(s=>{dados.regs=s.docs.map(x=>({id:x.id,...x.data()}));ok();},err);
  db.collection('navios').where('ativo','==',true).limit(1)
    .onSnapshot(s=>{dados.navio=s.empty?null:{id:s.docs[0].id,...s.docs[0].data()};
      if(dados.navio)db.collection('embarque_horas').where('navioId','==',dados.navio.id)
        .onSnapshot(h=>{dados.horas=h.docs.map(x=>x.data());ok();},err);
      ok();},err);
  db.collection('programacoes').where('aberta','==',true)
    .onSnapshot(s=>{dados.progs=s.docs.map(x=>x.data());ok();},err);
  db.collection('estoque_horas').where('data','==',d)
    .onSnapshot(s=>{dados.estoque=s.docs.map(x=>x.data()).sort((a,b)=>a.hora.localeCompare(b.hora));ok();},err);
  db.collection('contagens_armazem').orderBy('data','desc').limit(1)
    .onSnapshot(s=>{dados.contagem=s.empty?null:s.docs[0].data();ok();},err);
}
function err(e){console.error(e);}
function ok(){ultOk=Date.now();pintar();}

// ══ QUADRANTE 1 — DESCARGA ══
function descarga(){
  const box=document.getElementById('q-descarga');
  const regs=dados.regs;
  const ferro=regs.filter(r=>r.atividade==='recebimento'&&r.producao?.tipo==='Ferro');
  const rodo =regs.filter(r=>r.atividade==='recebimento'&&r.producao?.tipo==='Rodo');
  const vg=ferro.reduce((s,r)=>s+(r.producao.qtd||0),0);
  const at=rodo.reduce((s,r)=>s+(r.producao.qtd||0),0);
  const car=rodo.reduce((s,r)=>s+(r.producao.carretas||0),0);

  let h=`<div class="nums">
    <div class="nn"><div class="v">${vg}</div><div class="l">Vagões</div></div>
    <div class="nn t"><div class="v">${fmt(vg*TON_VAGAO)}</div><div class="l">t ferroviário</div></div>
    <div class="nn o"><div class="v">${car}</div><div class="l">Carretas</div></div>
    <div class="nn g"><div class="v">${fmt(at*TON_ATADO)}</div><div class="l">t rodoviário</div></div>
  </div>`;

  const pf=dados.progs.filter(p=>p.tipo==='ferro'), pr=dados.progs.filter(p=>p.tipo==='rodo');
  pf.forEach(p=>{
    const pc=p.vagoesProg?Math.min(100,vg/p.vagoesProg*100):0;
    h+=`<div class="prog"><div class="tp"><b>Ferro · ${p.prefixo||''}</b>
      <span>${vg} de ${p.vagoesProg} vagões · ${pc.toFixed(0)}%</span></div>
      <div class="barra"><i class="${pc>=100?'ok':''}" style="width:${pc}%"></i></div></div>`;
    const cheios=Math.min(40,vg);
    h+=`<div class="vias">${['L4','L3','L2','L1'].map((l,li)=>{
      const base=(3-li)*10;
      return `<div class="via"><span class="vn">${l}</span>${[...Array(10)].map((_,j)=>
        `<div class="vg ${base+j<cheios?'ok':''}"></div>`).join('')}</div>`;
    }).join('')}</div>`;
  });
  pr.forEach(p=>{
    const pc=p.carretasProg?Math.min(100,car/p.carretasProg*100):0;
    h+=`<div class="prog"><div class="tp"><b>Rodo · ${p.sku||''}</b>
      <span>${car} de ${p.carretasProg} carretas · ${pc.toFixed(0)}%</span></div>
      <div class="barra"><i class="${pc>=100?'ok':''}" style="width:${pc}%"></i></div></div>`;
  });
  if(!pf.length&&!pr.length&&!vg&&!at)h+='<div class="vazio">Sem descarga programada ou lançada hoje.</div>';
  box.innerHTML=h;
}

// ══ QUADRANTE 2 — EMBARQUE ══
function embarque(){
  const box=document.getElementById('q-embarque');
  const n=dados.navio;
  if(!n){box.innerHTML='<div class="vazio">Nenhum navio em operação.</div>';return;}
  const hs=dados.horas;
  const carregado=hs.reduce((s,x)=>s+(x.somaTon||0),0);
  const saldo=Math.max(0,(n.total||0)-carregado);
  const pc=n.total?carregado/n.total*100:0;
  const doDia=hs.filter(x=>x.data===hoje()).sort((a,b)=>a.hora.localeCompare(b.hora));
  const ultima=doDia[doDia.length-1];

  const porPorao={};
  hs.forEach(x=>(x.ternos||[]).forEach(t=>{if(t.porao)porPorao[t.porao]=(porPorao[t.porao]||0)+(t.ton||0);}));
  const maxCap=Math.max(...Object.values(n.poroes||{1:1}));

  box.innerHTML=`
    <div style="font-size:14px;font-weight:800;margin-bottom:2px;">${n.nome}${n.viagem?' · '+n.viagem:''}</div>
    <div style="font-size:10.5px;color:var(--muted);font-weight:600;margin-bottom:10px;">
      ${[n.produto,n.destino,'Berço 32'].filter(Boolean).join(' · ')}</div>
    <div class="nums">
      <div class="nn t"><div class="v">${fmt(carregado)}</div><div class="l">t embarcadas</div></div>
      <div class="nn o"><div class="v">${fmt(saldo)}</div><div class="l">t de saldo</div></div>
      <div class="nn g"><div class="v">${pc.toFixed(1)}%</div><div class="l">Concluído</div></div>
      <div class="nn"><div class="v">${ultima?fmt(ultima.somaTon):'—'}</div><div class="l">t/h · ${ultima?ultima.hora:'—'}</div></div>
    </div>
    <div class="poroes">${Object.entries(n.poroes||{}).map(([p,prev])=>{
      const feito=porPorao[p]||0, pcp=prev?Math.min(100,feito/prev*100):0, alt=(prev/maxCap*100);
      return `<div class="po"><div class="pc" style="color:${pcp>=99?'var(--verde)':'var(--txt)'}">${pcp.toFixed(0)}%</div>
        <div class="cx" style="height:${Math.max(8,alt)}%"><i class="${pcp>=99?'ok':''}" style="height:${pcp}%"></i></div>
        <div class="nm">P${p}</div></div>`;
    }).join('')}</div>`;
}

const ATV={embarque:'⚓ Embarque',recebimento:'🚛 Recebimento',armazenagem:'🏗️ Armazenagem',
           limpeza:'🧹 Limpeza',abastecimento:'⛽ Abastecimento',avarias:'⚠️ Avarias',outros:'📌 Outros'};

function operacao(){
  const box=document.getElementById('q-operacao');
  const pi=curPer();
  const doPeriodo=dados.regs.filter(r=>r.periodoIdx===pi);
  const ativas=doPeriodo.filter(r=>r.frente?.ativa);
  const lista=ativas.length?ativas:doPeriodo;

  const casa=lista.reduce((s,r)=>s+(r.efetivo?.auxCasa||0)+(r.efetivo?.opCasa||0),0);
  const ogmo=lista.reduce((s,r)=>s+(r.efetivo?.ogmo||0),0);
  const maq=new Set();
  lista.forEach(r=>{
    (r.recursos?.empilhadeiras||[]).forEach(m=>m.maq&&maq.add(m.maq));
    (r.recursos?.porticos||[]).forEach(m=>m.maq&&maq.add(m.maq));
  });
  const defs=dados.regs.filter(r=>r.recursos?.defeitos?.ativo).length;
  const tpas=dados.regs.filter(r=>r.recursos?.tpa?.ativo).length;

  let h=`<div class="nums">
    <div class="nn"><div class="v">${casa+ogmo}</div><div class="l">Efetivo</div></div>
    <div class="nn t"><div class="v">${lista.length}</div><div class="l">Frentes</div></div>
    <div class="nn g"><div class="v">${maq.size}</div><div class="l">Máquinas</div></div>
    <div class="nn r"><div class="v">${defs+tpas}</div><div class="l">Ocorrências</div></div>
  </div>`;

  if(!lista.length){box.innerHTML=h+'<div class="vazio">Nenhum lançamento neste período.</div>';return;}

  h+=lista.sort((a,b)=>(a.frente?.inicio||'').localeCompare(b.frente?.inicio||'')).map(r=>{
    const e=r.efetivo||{};
    const pessoas=[r.colaborador,...(e.colegas||[]).map(c=>c.nome+(c.fte?' (FTE)':''))].filter(Boolean);
    const ms=[...(r.recursos?.empilhadeiras||[]),...(r.recursos?.porticos||[])]
             .map(m=>m.maq+(m.op?' · '+m.op:'')).filter(Boolean);
    let prod='';
    const p=r.producao;
    if(p){
      if(p.unidade==='ton'&&p.valor)prod=`<span class="pill">${fmt(p.valor)} t</span>`;
      else if(p.unidade==='vaos')prod=`<span class="pill">${p.valor} vãos</span>`;
      else if(p.unidade==='maquinas')prod=`<span class="pill">${p.valor} máq.</span>`;
    }
    return `<div class="frente" style="border-left-color:${r.frente?.ativa?'var(--verde)':'var(--teal)'}">
      <div class="t"><span>${ATV[r.atividade]||r.atividade}</span>
        ${r.frente?.ativa?'<em>● em andamento</em>':`<span style="font-size:10px;color:var(--muted);font-weight:600;">${r.frente?.inicio||''}–${r.frente?.fim||''}</span>`}</div>
      <div class="d">${prod}
        ${e.ogmo?`<span class="pill o">${e.ogmo} OGMO</span>`:''}
        ${r.detalhe?r.detalhe+'<br>':''}
        <b style="color:var(--txt);">${pessoas.join(', ')}</b>
        ${ms.length?'<br>'+ms.join(' · '):''}</div>
    </div>`;
  }).join('');
  box.innerHTML=h;
}

// ══ QUADRANTE 4 — ESTOQUE ══
const VAOS_ORDEM=['V08','V21','V20','V19','V18','V17','V16','V15','V14','V13','V12','V11','V10','V09',
                  'V07','V06','V05','V04','V03','V02','V01'];
const CAP_V={V01:1618,V02:1334,V03:638,V04:578,V05:878,V06:522,V07:522,V08:462,
  V09:792,V10:1596,V11:798,V12:1596,V13:1664,V14:1596,V15:798,V16:1596,
  V17:1664,V18:798,V19:1664,V20:1596,V21:710};

function estoque(){
  const box=document.getElementById('q-estoque');
  const e=dados.estoque, ult=e[e.length-1];
  const c=dados.contagem;

  if(!ult&&!c){box.innerHTML='<div class="vazio">Nenhum estoque lançado hoje.</div>';return;}

  const geral=ult?ult.atadosGeral:0, avaria=ult?ult.atadosAvaria:0;
  let h=`<div class="nums">
    <div class="nn"><div class="v">${fmt(geral)}</div><div class="l">Atados geral</div></div>
    <div class="nn t"><div class="v">${fmt(geral*TON_ATADO)}</div><div class="l">Toneladas</div></div>
    <div class="nn r"><div class="v">${fmt(avaria)}</div><div class="l">Atados avaria</div></div>
    <div class="nn g"><div class="v">${ult?ult.hora:'—'}</div><div class="l">Último lançamento</div></div>
  </div>`;

  if(e.length>1){
    const max=Math.max(...e.map(x=>x.total));
    h+=`<div style="display:flex;align-items:flex-end;gap:4px;height:56px;margin-bottom:10px;">
      ${e.map(x=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;"
        title="${x.hora}: ${fmt(x.total)}">
        <div style="width:100%;max-width:26px;height:${(x.total/max*100)||3}%;background:var(--teal);border-radius:3px 3px 0 0;min-height:3px;"></div>
        <div style="font-size:7px;color:var(--muted);font-weight:700;margin-top:2px;">${x.hora.slice(0,2)}</div>
      </div>`).join('')}</div>`;
  }

  if(c){
    const porPonto={};
    (c.pontos||[]).forEach(p=>{porPonto[p.ponto]=(porPonto[p.ponto]||0)+p.qtd;});
    h+=`<div style="font-size:9.5px;color:var(--muted);font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px;">
      Ocupação por vão · contagem de ${c.data.slice(8,10)}/${c.data.slice(5,7)}</div>
      <div class="vaos">${VAOS_ORDEM.map(v=>{
        const q=porPonto[v]||0, cap=CAP_V[v]||1, pc=Math.min(100,q/cap*100);
        return `<div class="vv" title="${v}: ${fmt(q)} de ${fmt(cap)}"><i class="${pc>=85?'cheio':''}" style="height:${pc}%"></i></div>`;
      }).join('')}</div>
      <div class="vzr">${VAOS_ORDEM.map(v=>`<span>${v.slice(1)}</span>`).join('')}</div>`;
    if(c.divergencia!=null&&Math.abs(c.divergencia)>0){
      h+=`<div style="font-size:10.5px;font-weight:700;margin-top:8px;color:${Math.abs(c.divergencia)>200?'var(--danger)':'var(--muted)'};">
        Divergência da última contagem: ${fmt(Math.abs(c.divergencia))} atados</div>`;
    }
  }
  box.innerHTML=h;
}

</script>
